; Custom PHP configuration for EasyReservation backend
; This file is loaded by PHP-FPM via /usr/local/etc/php/conf.d/

; Enable output buffering – without this, any stray output during Laravel's
; bootstrap phase causes PHP to commit its default Content-Type (text/html)
; before Symfony's Response::sendHeaders() can set the correct one.
output_buffering = 4096

; Production-safe defaults
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Charset (already the default, but explicit for clarity)
default_charset = "UTF-8"

; Performance
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; Upload limits (adjust if you handle file uploads)
upload_max_filesize = 10M
post_max_size = 12M

; Memory
memory_limit = 256M

; Timezone (fallback; Laravel sets its own via config/app.php)
date.timezone = UTC
