<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyReservation</title>
  </head>
  <body>
    <div id="app">
      <div class="boot-loader" role="status" aria-label="Loading">
        <div class="boot-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <style>
      .boot-loader { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      .boot-spinner { width: 48px; height: 48px; border: 4px solid #d1d5db; border-top-color: #2563eb; border-radius: 50%; animation: boot-spin 1s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
