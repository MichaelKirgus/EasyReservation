name: Docker Image CI

on:
  push:
    branches: [ "dev" ]
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: dev
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.IMAGE_PUSH_TOKEN }}
      - name: Build Docker image for backend
        run: docker build -t ${{ github.repository }}/backend:latest ./backend
      - name: Build Docker image for frontend
        run: docker build -t ${{ github.repository }}/frontend:latest ./frontend
      - name: Push Docker image for backend
        run: docker push ${{ github.repository }}/backend:latest
      - name: Push Docker image for frontend
        run: docker push ${{ github.repository }}/frontend:latest
