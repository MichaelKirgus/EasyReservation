name: Docker Image CI (Versioned)

on:
  push:
    branches:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Get repo info
        id: vars-repo
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=$REPO" >> $GITHUB_OUTPUT

      - name: Determine image tag from branch
        id: vars-tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Write version file
        run: |
          VERSION="${{ steps.vars-tag.outputs.tag }}"
          echo "$VERSION" > backend/version.txt
          echo "$VERSION" > frontend/version.txt
          
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build Docker image for backend
        run: docker build --build-arg APP_VERSION=$(cat backend/version.txt) -t ghcr.io/${{ steps.vars-repo.outputs.repo }}/backend:${{ steps.vars-tag.outputs.tag }} ./backend

      - name: Build Docker image for frontend
        run: docker build --build-arg APP_VERSION=$(cat frontend/version.txt) -t ghcr.io/${{ steps.vars-repo.outputs.repo }}/frontend:${{ steps.vars-tag.outputs.tag }} ./frontend

      - name: Push Docker image for backend
        run: docker push ghcr.io/${{ steps.vars-repo.outputs.repo }}/backend:${{ steps.vars-tag.outputs.tag }}

      - name: Push Docker image for frontend
        run: docker push ghcr.io/${{ steps.vars-repo.outputs.repo }}/frontend:${{ steps.vars-tag.outputs.tag }}
